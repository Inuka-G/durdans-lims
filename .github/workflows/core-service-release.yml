name: Core Service Release

# Build the image, scan it, push to ECR, and roll it out to the host via SSM.
# All AWS steps are gated on the AWS_DEPLOY_ROLE_ARN repo variable, so before the
# cloud is wired this workflow still builds + scans the image (useful CI signal).

on:
  push:
    branches: [main]
    paths:
      - "apps/lims-core-service/**"
      - ".github/workflows/core-service-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC -> AWS
  security-events: write # Trivy SARIF upload

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
  ECR_REPO: durdans-lims/core-service

defaults:
  run:
    working-directory: apps/lims-core-service

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test + build jar
        run: ./gradlew clean build --no-daemon

      - name: Build image
        run: docker build -t lims-core-service:${{ github.sha }} .

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lims-core-service:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # trivy-action is a `uses:` step, so it ignores defaults.run.working-directory
      # and writes to the workspace root. Both paths below must stay root-relative.
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif

      - name: Configure AWS credentials (OIDC)
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag + push to ECR
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker tag lims-core-service:${{ github.sha }} $REG/$ECR_REPO:${{ github.sha }}
          docker tag lims-core-service:${{ github.sha }} $REG/$ECR_REPO:latest
          docker push $REG/$ECR_REPO:${{ github.sha }}
          docker push $REG/$ECR_REPO:latest

      - name: Deploy to host (SSM — pull + restart)
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        run: |
          PARAMS=$(jq -nc --arg command "/opt/lims/deploy-service.sh app $GITHUB_SHA" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --comment "deploy backend ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
