version: 2

# Monthly + grouped + low PR limits on purpose. Weekly ungrouped updates across
# five ecosystems produced a flood of PRs that nobody triaged, which is worse
# than no automation at all.

updates:
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/lims-core-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/lims-instrument-simulator
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /apps/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /apps/lims-core-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # One entry covers every workflow in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
