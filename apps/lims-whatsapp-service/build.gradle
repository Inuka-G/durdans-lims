plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.uom.lims'
version = '0.0.1-SNAPSHOT'

// Security patch levels newer than the Spring Boot 3.5.14 BOM, kept byte-identical
// to lims-core-service so the two services never resolve different versions of the
// same transitive component in the same deployment.
ext {
	set('spring-framework.version', '6.2.19')
	set('spring-data-bom.version', '2025.0.12')
	set('tomcat.version', '10.1.55')
	set('postgresql.version', '42.7.12')
	set('netty.version', '4.1.136.Final')
	set('micrometer.version', '1.15.12')
	set('jackson-bom.version', '2.21.4')
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.liquibase:liquibase-core'

	// Observability, wired the same way as lims-core-service so the existing
	// Prometheus scrape config and Tempo pipeline pick this service up unchanged.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
	mainClass = 'com.uom.lims.whatsapp.WhatsAppServiceApplication'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

bootJar {
	enabled = true
	archiveFileName = "lims-whatsapp-service.jar"
}
