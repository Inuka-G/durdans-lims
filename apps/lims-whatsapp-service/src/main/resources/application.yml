server:
  port: 11010
  error:
    # Same posture as lims-core-service: nothing about the internals reaches a
    # caller. The webhook is on the public internet, so this matters more here.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  # Actuator lives on a separate internal port that is never published. Meta only
  # ever reaches 11010, and 11010 serves nothing but the webhook.
  server:
    port: 11011
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Tracing mirrors lims-core-service so both services land in the same Tempo view.
  # Export is switchable because there is no collector on the production host: an
  # exporter pointed at a collector that is not there retries and warns forever, which
  # turns a nice-to-have into log noise on the one deployment people actually read.
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

spring:
  application:
    name: lims-whatsapp-service

  datasource:
    # A SEPARATE database from durdans_lims_db, on the same Postgres instance, with
    # its own user. This is not tidiness: it is the mechanism that makes "a bug in the
    # agent cannot corrupt a specimen record" true rather than aspirational. The agent
    # reaches clinical data only through lims-core-service's HTTP API, under a Keycloak
    # service account with read-only scopes.
    url: ${WA_DB_URL:jdbc:postgresql://localhost:5434/durdans_wa_db}
    username: ${WA_DB_USERNAME:postgres}
    password: ${WA_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/liquibase/master.xml

app:
  meta:
    # Meta credentials. NEVER commit real values — supply them through the
    # environment or AWS Secrets Manager, exactly as lims-core-service does for
    # SMTP and SMS. An empty app-secret makes the service reject every webhook
    # rather than accept unverified ones; see MetaSignatureVerifier.
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    # The value Meta echoes back during webhook subscription. Ours to choose, but
    # it must be high-entropy: it is the only thing standing between an attacker
    # and hijacking the callback registration.
    verify-token: ${META_VERIFY_TOKEN:}
    phone-number-id: ${META_PHONE_NUMBER_ID:}
    business-account-id: ${META_WABA_ID:}
    access-token: ${META_ACCESS_TOKEN:}
    graph-base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com}
    graph-version: ${META_GRAPH_VERSION:v26.0}

  auto-reply:
    # First-touch acknowledgement: one greeting per conversation per cooldown, only
    # inside the 24-hour window. This is the fallback tier — it answers only when the
    # agent below is not configured or the message carries no text.
    enabled: ${AUTO_REPLY_ENABLED:true}
    cooldown: ${AUTO_REPLY_COOLDOWN:PT1H}
    # Empty means the built-in bilingual default in AutoReplyProperties.
    greeting: ${AUTO_REPLY_GREETING:}

  agent:
    # The Gemini text agent. Fails closed exactly like everything else here: with the
    # API key or the service-account secret missing it never engages and the greeting
    # tier answers instead. Defaults for the URLs are the compose-network addresses.
    enabled: ${AGENT_ENABLED:true}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    core-base-url: ${AGENT_CORE_BASE_URL:http://app:11000}
    token-url: ${AGENT_TOKEN_URL:http://keycloak:8080/realms/lims-realm/protocol/openid-connect/token}
    client-id: ${AGENT_CLIENT_ID:lims-agent}
    client-secret: ${AGENT_CLIENT_SECRET:}
    max-tool-rounds: ${AGENT_MAX_TOOL_ROUNDS:4}
    history-limit: ${AGENT_HISTORY_LIMIT:10}

logging:
  level:
    com.uom.lims.whatsapp: INFO
