# This environment's path to repo.maven.apache.org intermittently corrupts
# large TLS downloads mid-transfer ("bad_record_mac" / Tag mismatch) inside
# the Docker build — reproduced repeatedly rebuilding lims-core-service:local
# locally, on different dependency jars each time, while the same host can
# curl the same URLs directly without issue. Gradle's own default retry count
# (3 attempts) isn't enough to reliably ride that out; raising it costs
# nothing on a healthy network.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
